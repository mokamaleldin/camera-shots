<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mohamed Kamaleldin (محمد كمال الدين)" />
    <meta name="description" content="محاكي وحاسبة عمق الميدان والعدسات الفوتوغرافية - Interactive Depth Of Field Simulator" />
    <title>محاكي عمق الميدان | Depth Of Field Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var l = localStorage.getItem("dof-lang") || "ar";
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
